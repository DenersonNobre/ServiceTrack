name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint & Testes Headless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup do Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Preparar dependencias locais (vendor)
        run: |
          mkdir -p ../.dnolib ../kortex
          tar -xzf ci/vendor/dnolib.tar.gz -C ../.dnolib
          tar -xzf ci/vendor/kortex.tar.gz -C ../kortex

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analise estatica (Linter estrito)
        run: flutter analyze --fatal-infos

      - name: Executar testes de unidade e widgets
        run: flutter test
